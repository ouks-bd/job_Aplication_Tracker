<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Application Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      padding: 30px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.8rem;
      color: #2c3e50;
    }

    /* ── FORM ── */
    #jobForm {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    #jobForm input,
    #jobForm select {
      flex: 1 1 160px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #jobForm input:focus,
    #jobForm select:focus { border-color: #3498db; }

    .salary-row {
      display: flex;
      flex: 1 1 100%;
      gap: 10px;
    }
    .salary-row input  { flex: 1; }
    .salary-row select { flex: 0 0 110px; }

    #btn {
      flex: 1 1 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn:hover { background-color: #2980b9; }

    /* ── FILTER BAR ── */
    .filter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    #sheetjsexport {
      padding: 8px 14px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #sheetjsexport:hover { background: #219150; }

    /* ── TABLE ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background-color: #2c3e50;
      color: white;
    }

    th { padding: 12px 14px; text-align: left; }
    td { padding: 11px 14px; border-bottom: 1px solid #eee; }

    tbody tr:hover { background-color: #f9f9f9; }

    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: bold;
    }
    .badge-Applied   { background: #d6eaf8; color: #1a6fa0; }
    .badge-Interview { background: #d5f5e3; color: #1e8449; }
    .badge-Rejected  { background: #fadbd8; color: #c0392b; }

    .salary-cell { color: #27ae60; font-weight: 600; }

    .empty-msg td {
      text-align: center;
      color: #aaa;
      padding: 24px;
    }

    .action-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 5px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .action-btn:hover { opacity: 0.75; }
    .edit   { background-color: #f39c12; color: white; margin-right: 5px; }
    .delete { background-color: #e74c3c; color: white; }

    /* ── EDIT MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 28px;
      width: min(400px, 90vw);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 4px; color: #2c3e50; }
    .modal input, .modal select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    .modal input:focus, .modal select:focus { border-color: #3498db; }

    .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
    .modal-save {
      flex: 1; padding: 9px;
      background: #3498db; color: white;
      border: none; border-radius: 6px;
      font-size: 0.9rem; cursor: pointer;
    }
    .modal-save:hover { background: #2980b9; }
    .modal-cancel {
      flex: 1; padding: 9px;
      background: #ecf0f1; color: #555;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Job Application Tracker</h1>

  <!-- Form -->
  <form id="jobForm">
    <input type="text" id="company" placeholder="Company Name" required />
    <input type="text" id="role"    placeholder="Job Role"     required />

    <div class="salary-row">
      <input type="number" id="salary"   placeholder="Salary (optional)" min="0" />
      <select id="currency">
        <option value="$">$ USD</option>
        <option value="€">€ EUR</option>
        <option value="£">£ GBP</option>
        <option value="₹">₹ INR</option>
        <option value="¥">¥ JPY</option>
      </select>
    </div>

    <select id="status">
      <option value="Applied">Applied</option>
      <option value="Interview">Interviewed</option>
      <option value="Rejected">Rejected</option>
    </select>

    <button id="btn" type="submit">Add Application</button>
  </form>

  <!-- Filter -->
  <div class="filter">
    <button id="sheetjsexport"><b>Export as XLSX</b></button>
    <select id="filterStatus">
      <option value="All">All</option>
      <option value="Applied">Applied</option>
      <option value="Interview">Interview</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Company</th>
        <th>Role</th>
        <th>Salary</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="jobList"></tbody>
  </table>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Application</h2>
    <input type="text"   id="editCompany"  placeholder="Company Name" />
    <input type="text"   id="editRole"     placeholder="Job Role" />
    <input type="number" id="editSalary"   placeholder="Salary (optional)" min="0" />
    <select id="editCurrency">
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="£">£ GBP</option>
      <option value="₹">₹ INR</option>
      <option value="¥">¥ JPY</option>
    </select>
    <select id="editStatus">
      <option value="Applied">Applied</option>
      <option value="Interview">Interviewed</option>
      <option value="Rejected">Rejected</option>
    </select>
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelEdit">Cancel</button>
      <button class="modal-save"   id="saveEdit">Save Changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
  let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
  let editIndex = null;

  function save() { localStorage.setItem('jobs', JSON.stringify(jobs)); }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatSalary(amount, currency) {
    if (!amount) return '—';
    return (currency || '$') + Number(amount).toLocaleString();
  }

  function render() {
    const filter = document.getElementById('filterStatus').value;
    const tbody  = document.getElementById('jobList');
    const list   = filter === 'All' ? jobs : jobs.filter(j => j.status === filter);

    if (list.length === 0) {
      tbody.innerHTML = `<tr class="empty-msg"><td colspan="5">No applications found. Add one above!</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(job => {
      const ri = jobs.indexOf(job);
      return `
        <tr>
          <td>${esc(job.company)}</td>
          <td>${esc(job.role)}</td>
          <td class="salary-cell">${formatSalary(job.salary, job.currency)}</td>
          <td><span class="badge badge-${job.status}">${job.status}</span></td>
          <td>
            <button class="action-btn edit"   onclick="openEdit(${ri})">Edit</button>
            <button class="action-btn delete" onclick="deleteJob(${ri})">Delete</button>
          </td>
        </tr>`;
    }).join('');
  }

  // Add — unshift puts new entry at the TOP
  document.getElementById('jobForm').addEventListener('submit', function(e) {
    e.preventDefault();
    jobs.unshift({
      company:  document.getElementById('company').value.trim(),
      role:     document.getElementById('role').value.trim(),
      salary:   document.getElementById('salary').value.trim(),
      currency: document.getElementById('currency').value,
      status:   document.getElementById('status').value,
    });
    save();
    render();
    this.reset();
    document.getElementById('currency').value = '$';
  });

  // Delete
  function deleteJob(i) {
    if (!confirm('Delete this application?')) return;
    jobs.splice(i, 1);
    save();
    render();
  }

  // Edit
  function openEdit(i) {
    editIndex = i;
    const j = jobs[i];
    document.getElementById('editCompany').value  = j.company;
    document.getElementById('editRole').value     = j.role;
    document.getElementById('editSalary').value   = j.salary || '';
    document.getElementById('editCurrency').value = j.currency || '$';
    document.getElementById('editStatus').value   = j.status;
    document.getElementById('editModal').classList.add('open');
  }

  document.getElementById('saveEdit').addEventListener('click', function() {
    if (editIndex === null) return;
    jobs[editIndex] = {
      company:  document.getElementById('editCompany').value.trim(),
      role:     document.getElementById('editRole').value.trim(),
      salary:   document.getElementById('editSalary').value.trim(),
      currency: document.getElementById('editCurrency').value,
      status:   document.getElementById('editStatus').value,
    };
    save();
    render();
    closeModal();
  });

  document.getElementById('cancelEdit').addEventListener('click', closeModal);
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function closeModal() {
    document.getElementById('editModal').classList.remove('open');
    editIndex = null;
  }

  document.getElementById('filterStatus').addEventListener('change', render);

  // Export XLSX
  document.getElementById('sheetjsexport').addEventListener('click', function() {
    if (!jobs.length) { alert('No applications to export!'); return; }
    const rows = jobs.map(j => ({
      Company: j.company,
      Role:    j.role,
      Salary:  j.salary ? (j.currency || '$') + j.salary : '',
      Status:  j.status,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Applications');
    XLSX.writeFile(wb, 'job_applications.xlsx');
  });

  render();
</script>
</body>
</html>
